# Render Blueprint — VendoPOS backend API (Express + Postgres/Neon).
# The Next.js frontend deploys separately on Vercel (root dir: frontend),
# with NEXT_PUBLIC_API_URL=https://vendopos.shop (same-origin proxy to this API).
#
# After the first apply: add the custom domain `api.vendopos.shop` to this
# service in the Render dashboard, and point a CNAME there from Hostinger.
services:
  - type: web
    name: vendopos-api
    runtime: node
    rootDir: backend
    region: singapore          # co-located with Neon ap-southeast-1 (low latency)
    plan: free                 # free idles/cold-starts; bump to "starter" for always-on + a disk
    branch: main
    healthCheckPath: /health
    # --include=dev so TypeScript (a devDependency) is installed even though
    # NODE_ENV=production; compile to dist/; then apply idempotent migrations
    # (migrate.ts uses CREATE/ALTER ... IF NOT EXISTS, so it's safe every deploy).
    buildCommand: npm install --include=dev && npm run build && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # paste your rotated Neon connection string when prompted
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong random secret (>=32 chars)
      - key: CORS_ORIGIN
        value: https://vendopos.shop,https://www.vendopos.shop
      - key: FRONTEND_URL
        value: https://vendopos.shop
      - key: PUBLIC_BASE_URL
        value: https://api.vendopos.shop
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://vendopos.shop/auth/google/callback   # via the Vercel same-origin proxy
      - key: RESEND_API_KEY
        sync: false            # leave blank to log emails instead of sending
      - key: EMAIL_FROM
        value: VendoPOS <noreply@vendopos.shop>
      - key: ADMIN_ALERT_EMAIL
        sync: false

# ── Persisting uploaded images (product photos + payment QRs) ─────────────────
# The free instance disk is EPHEMERAL: uploads vanish on every deploy/restart.
# To keep them, do all three:
#   1. change `plan: free` above to `plan: starter` (or higher),
#   2. add this env var to the list above:  - key: UPLOADS_DIR  value: /data/uploads
#   3. add this block to the service (same indent level as envVars):
#
#        disk:
#          name: uploads
#          mountPath: /data/uploads
#          sizeGB: 1
#
# (Alternatively, swap the bodies of products.storage.ts / paymentQr.storage.ts
#  for an object-store client — S3 / Supabase Storage / Cloudinary.)
