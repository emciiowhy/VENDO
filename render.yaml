# Render Blueprint — VendoPOS backend API (Express + Postgres/Neon).
# The Next.js frontend deploys separately on Vercel (root dir: frontend),
# with NEXT_PUBLIC_API_URL=https://api.vendopos.shop.
#
# After the first apply: add the custom domain `api.vendopos.shop` to this
# service in the Render dashboard, and point a CNAME there from Hostinger.
services:
  - type: web
    name: vendopos-api
    runtime: node
    rootDir: backend
    region: singapore          # co-located with Neon ap-southeast-1 (low latency)
    plan: free                 # free idles/cold-starts; bump to "starter" for always-on + a disk
    branch: main
    healthCheckPath: /health
    # --include=dev so TypeScript (a devDependency) is installed even though
    # NODE_ENV=production; compile to dist/; then apply idempotent migrations
    # (migrate.ts uses CREATE/ALTER ... IF NOT EXISTS, so it's safe every deploy).
    buildCommand: npm install --include=dev && npm run build && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # paste your rotated Neon connection string when prompted
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong random secret (>=32 chars)
      - key: CORS_ORIGIN
        value: https://vendopos.shop,https://www.vendopos.shop
      - key: FRONTEND_URL
        value: https://vendopos.shop
      - key: PUBLIC_BASE_URL
        value: https://api.vendopos.shop
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.vendopos.shop/auth/google/callback
      - key: RESEND_API_KEY
        sync: false            # leave blank to log emails instead of sending
      - key: EMAIL_FROM
        value: VendoPOS <noreply@vendopos.shop>
      - key: ADMIN_ALERT_EMAIL
        sync: false

# ── Uploaded images ─────────────────────────────────────────────────────────
# The free instance disk is EPHEMERAL, so uploaded images (product photos,
# payment QRs, logos, avatars) are stored in Postgres (`media_objects`) and
# served at /uploads by the API — no disk or bucket needed. UPLOADS_DIR only
# matters for legacy files written to disk before that change.
